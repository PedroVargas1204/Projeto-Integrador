<!doctype html>
<html lang="pt-BR" class="th-mallard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mallard</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <button type="button" class="brand-logo" id="brand-logo" aria-label="Mallard"></button>
        <div class="stack" style="gap:2px">
          <span class="brand-name">Mallard</span>
          <span class="brand-sub">DIAGNÓSTICO DE HARDWARE</span>
        </div>
      </div>
      <div class="nav" id="nav">
        <button type="button" class="nav-btn" data-page="computer" data-icon="monitor">Meu computador</button>
        <button type="button" class="nav-btn" data-page="guide" data-icon="book">Entenda seu PC</button>
        <button type="button" class="nav-btn" data-page="monitor" data-icon="activity">Monitoramento</button>
      </div>
      <div class="sidebar-bottom">
        <div class="stack">
          <div class="duck-picker-head"><span class="label" style="font-size:12px">Seu pato</span><span id="duck-name" style="font-size:14px;font-weight:600"></span></div>
          <div class="duck-picker" id="duck-picker"></div>
        </div>
        <button type="button" class="settings-link" data-page="settings" id="settings-link">
          <span class="row" style="gap:8px;font-size:14px;font-weight:600" id="settings-link-label">Configurações</span>
          <span class="faint" style="font-size:13px" id="device-label">Lendo o computador…</span>
        </button>
        <span class="version" id="version-label">Mallard</span>
      </div>
    </nav>
    <main class="content" id="content">
      <section class="page" id="page-computer" aria-label="Meu computador"></section>
      <section class="page" id="page-guide" aria-label="Entenda seu PC"></section>
      <section class="page" id="page-monitor" aria-label="Monitoramento"></section>
      <section class="page" id="page-settings" aria-label="Configurações"></section>
    </main>
  </div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/computer.js"></script>
  <script src="js/pages/guide.js"></script>
  <script src="js/pages/monitor.js"></script>
  <script src="js/pages/settings.js"></script>
  <script>App.start();</script>
</body>
</html>
